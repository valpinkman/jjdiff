[package]
name = "jjdiff-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jjdiff_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
jjdiff-vcs = { path = "../crates/vcs" }
jjdiff-diff = { path = "../crates/diff" }
jjdiff-watch = { path = "../crates/watch" }
tauri-plugin-dialog = "2.7.2"

# Single instance + arg forwarding: launching `jjdiff` in a second repo opens
# a new window in the existing process rather than a rival process fighting
# over the same review store.
tauri-plugin-single-instance = { version = "2", features = ["semver"] }

# SQLite for review comments (threaded, with anchors + timestamps) — the JSON
# review store was right for flags and walkthroughs, but comments want real queries.
rusqlite = { version = "0.31", features = ["bundled"] }
# r2d2 connection pool: Tauri commands are async + shared across the main thread
# and blocking pool; a pool keeps SQLite access simple and thread-safe.
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Base64 encoding for image bytes over IPC.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
