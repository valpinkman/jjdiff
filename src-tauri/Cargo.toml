[package]
name = "jjdiff-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jjdiff_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
jjdiff-vcs = { path = "../crates/vcs" }
jjdiff-diff = { path = "../crates/diff" }
jjdiff-watch = { path = "../crates/watch" }
tauri-plugin-dialog = "2.7.2"

# Single instance + arg forwarding: launching `jjdiff` in a second repo opens
# a new window in the existing process rather than a rival process fighting
# over the same review store.
tauri-plugin-single-instance = { version = "2", features = ["semver"] }

[dev-dependencies]
tempfile = "3"
