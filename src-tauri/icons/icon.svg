<?xml version="1.0" encoding="UTF-8"?>
<!--
  jjdiff app icon — source of truth for every generated size.

  Two panels side by side with one red line on the left and one green line on
  the right: a split diff, which is what the app is. Colours are DESIGN.md's
  dark-theme diff semantics (added #6fd094, removed #ee7e7e) on the panel
  surface, because those are the only two hues in the system allowed to mean
  something. No gradients, no glow — the same rules the UI follows.

  Regenerate every platform size with:
      rsvg-convert -w 1024 -h 1024 src-tauri/icons/icon.svg -o /tmp/jjdiff.png
      pnpm tauri icon /tmp/jjdiff.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Base squircle. Never pure black (DESIGN.md §2). -->
  <rect x="48" y="48" width="928" height="928" rx="208" fill="#17171b"/>
  <rect x="50" y="50" width="924" height="924" rx="206" fill="none"
        stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>

  <!-- Old side -->
  <rect x="144" y="272" width="328" height="480" rx="36" fill="#22222a"/>
  <g fill="#4a4a55">
    <rect x="196" y="340" width="200" height="44" rx="22"/>
    <rect x="196" y="540" width="160" height="44" rx="22"/>
  </g>
  <rect x="196" y="440" width="232" height="44" rx="22" fill="#ee7e7e"/>
  <rect x="196" y="640" width="190" height="44" rx="22" fill="#3a3a44"/>

  <!-- New side -->
  <rect x="552" y="272" width="328" height="480" rx="36" fill="#22222a"/>
  <g fill="#4a4a55">
    <rect x="604" y="340" width="176" height="44" rx="22"/>
    <rect x="604" y="540" width="200" height="44" rx="22"/>
  </g>
  <rect x="604" y="440" width="232" height="44" rx="22" fill="#6fd094"/>
  <rect x="604" y="640" width="150" height="44" rx="22" fill="#3a3a44"/>
</svg>
