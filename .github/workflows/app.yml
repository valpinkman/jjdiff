# The Tauri app and the UI bundle. This is the expensive half: src-tauri pulls
# the GTK/WebKit stack and most of the workspace's compile cost, so it gets
# its own workflow rather than sharing one with the pure crates.
name: App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Without this, a rapid succession of pushes to the same PR starts
# overlapping runs that race to save caches (rust-cache, pnpm) under the
# same key.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # src-tauri links against the GTK/WebKit stack on Linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev

      # Must run first: src-tauri's build.rs (tauri-build) fails when the
      # frontendDist path `ui/dist` does not exist, and it is gitignored. Both
      # cargo steps below trigger that build.rs, so neither can precede it.
      - name: Typecheck + bundle UI
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Lint
        run: cargo clippy -p jjdiff-app --all-targets -- -D warnings

      - name: Test
        run: cargo test -p jjdiff-app
