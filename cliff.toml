# git-cliff configuration. jjdiff's commit style is gitmoji
# (":emoji: (scope): message"), so conventional-commit parsing is off and
# grouping is done by emoji prefix. Bump rules: :boom: → major,
# :sparkles: → minor, anything else → patch. Release commits themselves
# (:bookmark:) never appear in the output.

[changelog]
header = """
# Changelog

All notable changes to jjdiff are documented here.
"""
body = """
{%- if version %}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
    ## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/valpinkman/jjdiff/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^:boom:", group = "<!-- 0 -->💥 Breaking Changes" },
  { message = "^:sparkles:", group = "<!-- 1 -->✨ Features" },
  { message = "^:bug:", group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "^:lipstick:", group = "<!-- 3 -->💄 UI & Polish" },
  { message = "^:recycle:", group = "<!-- 4 -->♻️ Refactoring" },
  { message = "^:memo:", group = "<!-- 5 -->📝 Documentation" },
  { message = "^:construction_worker:", group = "<!-- 6 -->👷 CI" },
  { message = "^:wrench:", group = "<!-- 7 -->🔧 Chores" },
  { message = "^:bookmark:", skip = true },
  { message = ".*", group = "<!-- 8 -->Other Changes" },
]

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
custom_major_increment_regex = "^:boom:"
custom_minor_increment_regex = "^:sparkles:"
