# Pure Rust crates: no Tauri, no GTK/WebKit, no node. ~42 CPU-seconds of rustc
# and a small nix closure, so this gives fast signal on its own 5m budget.
# The Tauri app is checked separately in app.yml.
when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

# Pinned: the default floating channel dropped nodejs_20 (upstream EOL
# 2026-04-30) out from under us. Bump this deliberately instead.
registry:
  nixpkgs: github:nixos/nixpkgs/nixos-26.05

environment:
  # Incremental state is dead weight in a throwaway VM, and debug info roughly
  # doubles the target dir for no benefit when nothing here is debugged.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: "never"

dependencies:
  - gcc
  - cargo
  - clippy
  - rustc
  # crates/vcs and crates/diff tests shell out to `jj`
  - jujutsu
  - git

steps:
  - name: "Lint"
    command: "cargo clippy -p jjdiff-vcs -p jjdiff-diff -p jjdiff-watch --all-targets -- -D warnings"

  - name: "Test"
    command: "cargo test -p jjdiff-vcs -p jjdiff-diff -p jjdiff-watch"
