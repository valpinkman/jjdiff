[workspace]
resolver = "2"
members = ["crates/vcs", "crates/diff", "crates/watch", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/valpinkman/jjdiff"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
strip = true
